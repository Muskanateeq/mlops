name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app.py main.py schemas.py train_model.py tests

      - name: Run API tests
        run: python -m unittest discover -s tests -v

  publish-image:
    name: Build and publish container
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests build the image only; main publishes it.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-hugging-face:
    name: Deploy Gradio Space to Hugging Face
    needs: [test, publish-image]
    # Deployment happens only after CI and the main-branch container build succeed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Hugging Face upload client
        run: |
          python -m pip install -r requirements.txt
          python -m pip install --upgrade "huggingface_hub>=0.32"

      - name: Train deployment model with pinned runtime version
        run: python train_model.py

      - name: Upload Gradio Space to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ vars.HF_USERNAME }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          test -n "$HF_TOKEN"
          test -n "$HF_USERNAME"
          test -n "$HF_SPACE_NAME"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          HfApi(token=os.environ["HF_TOKEN"]).upload_folder(
              repo_id=f"{os.environ['HF_USERNAME']}/{os.environ['HF_SPACE_NAME']}",
              repo_type="space",
              folder_path=".",
              ignore_patterns=[
                  ".git/**", ".github/**", ".gitignore", ".dockerignore",
                  "Dockerfile", "tests/**", "venv/**", ".venv/**", "mlruns/**",
              ],
              commit_message=f"Deploy {os.environ['GITHUB_SHA']}",
          )
          PY
